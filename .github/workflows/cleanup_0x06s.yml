name: 🧹 Full Repository Cleanup

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Delete 0x03s Output Files
        shell: bash
        run: |
          echo "Removing generated download contents..."

          # Remove everything inside dl/, then remove the folder itself.
          rm -rf dl

          # Remove Links.md generated by 0x03s.
          rm -f Links.md

          # Keep the cleanup workflow itself and any other repository files.
          git status --short

      - name: Commit Cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No repository files need cleaning."
            exit 0
          fi

          git commit -m "Clean generated downloads and Links.md [skip ci]"

      - name: Push Cleanup
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt/5..."

            git fetch origin "$BRANCH"

            if git rebase "origin/$BRANCH"; then
              if git push origin HEAD:"$BRANCH"; then
                echo "Cleanup committed successfully."
                break
              fi
            else
              echo "Rebase failed. Aborting..."
              git rebase --abort || true
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "ERROR: Could not push cleanup after 5 attempts."
              exit 1
            fi

            sleep 3
          done

      - name: Delete Workflow Run Histories
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${GITHUB_REPOSITORY}"
          CURRENT_RUN="${GITHUB_RUN_ID}"

          echo "Deleting workflow run histories..."
          echo "Current cleanup run: $CURRENT_RUN"

          # Delete every existing run except this currently executing cleanup run.
          # The current run is intentionally retained because deleting an
          # in-progress run can terminate the workflow before cleanup finishes.
          page=1

          while true; do
            RESPONSE=$(gh api \
              --method GET \
              "/repos/${REPO}/actions/runs?per_page=100&page=${page}")

            RUN_IDS=$(printf '%s' "$RESPONSE" | jq -r \
              '.workflow_runs[] | select(.id != '"$CURRENT_RUN"') | .id')

            [ -z "$RUN_IDS" ] && break

            while IFS= read -r RUN_ID; do
              [ -z "$RUN_ID" ] && continue

              echo "Deleting workflow run: $RUN_ID"

              if gh api \
                --method DELETE \
                -H "Accept: application/vnd.github+json" \
                "/repos/${REPO}/actions/runs/${RUN_ID}"; then
                echo "Deleted: $RUN_ID"
              else
                echo "Could not delete run $RUN_ID; continuing..."
              fi
            done <<< "$RUN_IDS"

            # Always re-read page 1 because deleting entries changes pagination.
            page=1
          done

          echo "All previous workflow histories have been removed."
          echo "The current cleanup run remains visible while it is executing."
          echo "After it finishes, GitHub may retain this single cleanup-run entry."
